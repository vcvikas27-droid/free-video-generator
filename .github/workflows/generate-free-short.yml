name: Generate Free Hindi Short
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/free_short_generator.py"
      - ".github/workflows/generate-free-short.yml"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          pip install edge-tts pillow
      - name: Generate MP4
        run: python tools/free_short_generator.py
      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-motivation-short
          path: output/hindi_motivation_short.mp4
          if-no-files-found: error
          retention-days: 7
